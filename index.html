<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a2332">
<title>ADETSIS Barkod Sorgula</title>
<link rel="manifest" href="data:application/json;base64,eyJuYW1lIjoiQURFVFNJUyBCYXJrb2QiLCJzaG9ydF9uYW1lIjoiQmFya29kIiwic3RhcnRfdXJsIjoiLiIsImRpc3BsYXkiOiJzdGFuZGFsb25lIiwiYmFja2dyb3VuZF9jb2xvciI6IiMxYTIzMzIiLCJ0aGVtZV9jb2xvciI6IiMxYTIzMzIiLCJpY29ucyI6W119">
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --primary: #1a2332;
    --accent: #2e7d32;
    --accent-light: #e8f5e9;
    --danger: #c62828;
    --danger-light: #ffebee;
    --warning: #ef6c00;
    --warning-light: #fff3e0;
    --info: #1565c0;
    --info-light: #e3f2fd;
    --text: #1a2332;
    --text-secondary: #5f6b7a;
    --border: #dfe3e8;
    --radius: 12px;
    --shadow: 0 2px 8px rgba(0,0,0,0.08);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
  }

  header {
    background: var(--primary);
    color: #fff;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  header svg { flex-shrink: 0; }

  header h1 {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.2px;
  }

  header p {
    font-size: 12px;
    opacity: 0.7;
    margin-top: 2px;
  }

  .container {
    max-width: 480px;
    margin: 0 auto;
    padding: 16px;
  }

  /* Tab bar */
  .tabs {
    display: flex;
    background: var(--surface);
    border-radius: var(--radius);
    padding: 4px;
    box-shadow: var(--shadow);
    margin-bottom: 16px;
  }

  .tab {
    flex: 1;
    padding: 10px;
    text-align: center;
    font-size: 14px;
    font-weight: 500;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .tab.active {
    background: var(--primary);
    color: #fff;
  }

  .tab svg { width: 18px; height: 18px; }

  /* Scanner */
  .scanner-section, .manual-section {
    display: none;
  }
  .scanner-section.active, .manual-section.active {
    display: block;
  }

  #reader {
    background: var(--surface);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
  }

  #reader video { border-radius: var(--radius); }

  /* Manual input */
  .input-group {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: var(--shadow);
  }

  .input-group label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    margin-bottom: 8px;
  }

  .input-row {
    display: flex;
    gap: 8px;
  }

  .input-row input {
    flex: 1;
    padding: 12px 14px;
    border: 2px solid var(--border);
    border-radius: 8px;
    font-size: 16px;
    font-family: 'SF Mono', 'Menlo', monospace;
    letter-spacing: 0.5px;
    outline: none;
    transition: border-color 0.2s;
  }

  .input-row input:focus {
    border-color: var(--primary);
  }

  .btn {
    padding: 12px 20px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .btn-primary {
    background: var(--primary);
    color: #fff;
  }

  .btn-primary:active { transform: scale(0.96); }

  /* Loading */
  .loading {
    display: none;
    text-align: center;
    padding: 32px 20px;
  }

  .loading.active { display: block; }

  .spinner {
    width: 32px;
    height: 32px;
    border: 3px solid var(--border);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin: 0 auto 12px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .loading p {
    font-size: 14px;
    color: var(--text-secondary);
  }

  /* Results */
  .results {
    display: none;
    margin-top: 16px;
  }

  .results.active { display: block; }

  .results-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }

  .results-header h2 {
    font-size: 16px;
    font-weight: 600;
  }

  .results-count {
    font-size: 12px;
    background: var(--primary);
    color: #fff;
    padding: 3px 10px;
    border-radius: 20px;
  }

  .asset-info {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 16px;
    box-shadow: var(--shadow);
    margin-bottom: 12px;
  }

  .asset-info .address {
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 4px;
    line-height: 1.4;
  }

  .asset-info .binano {
    font-size: 15px;
    font-weight: 600;
    font-family: 'SF Mono', 'Menlo', monospace;
  }

  /* Cards */
  .card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 14px 16px;
    box-shadow: var(--shadow);
    margin-bottom: 8px;
    border-left: 4px solid transparent;
  }

  .card.kirmizi { border-left-color: var(--danger); }
  .card.yesil { border-left-color: var(--accent); }
  .card.mavi { border-left-color: var(--info); }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }

  .card-date {
    font-size: 15px;
    font-weight: 600;
  }

  .badge {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 20px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }

  .badge.kirmizi { background: var(--danger-light); color: var(--danger); }
  .badge.yesil { background: var(--accent-light); color: var(--accent); }
  .badge.mavi { background: var(--info-light); color: var(--info); }

  .card-inspector {
    font-size: 13px;
    color: var(--text-secondary);
  }

  /* Error */
  .error-box {
    display: none;
    background: var(--danger-light);
    border: 1px solid #ffcdd2;
    border-radius: var(--radius);
    padding: 16px;
    margin-top: 16px;
    text-align: center;
  }

  .error-box.active { display: block; }

  .error-box p {
    font-size: 14px;
    color: var(--danger);
  }

  /* Scanned label banner */
  .scanned-label {
    display: none;
    background: var(--accent-light);
    border: 1px solid #c8e6c9;
    border-radius: var(--radius);
    padding: 12px 16px;
    margin-top: 12px;
    text-align: center;
  }

  .scanned-label.active { display: block; }

  .scanned-label span {
    font-size: 13px;
    color: var(--accent);
  }

  .scanned-label strong {
    display: block;
    font-size: 18px;
    font-family: 'SF Mono', 'Menlo', monospace;
    color: var(--text);
    margin-top: 4px;
  }

  /* Clear button */
  .btn-clear {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-secondary);
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
  }

  /* Camera permission */
  .camera-prompt {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 40px 20px;
    text-align: center;
    box-shadow: var(--shadow);
  }

  .camera-prompt svg {
    margin-bottom: 16px;
    opacity: 0.4;
  }

  .camera-prompt p {
    font-size: 14px;
    color: var(--text-secondary);
    margin-bottom: 16px;
  }

  /* History */
  .history-section {
    margin-top: 24px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }

  .history-section h3 {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    margin-bottom: 8px;
  }

  .history-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .history-chip {
    font-size: 13px;
    font-family: 'SF Mono', 'Menlo', monospace;
    padding: 6px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .history-chip:active {
    background: var(--primary);
    color: #fff;
  }
</style>
</head>
<body>

<header>
  <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <rect x="3" y="3" width="7" height="7" rx="1"/>
    <rect x="14" y="3" width="7" height="7" rx="1"/>
    <rect x="3" y="14" width="7" height="7" rx="1"/>
    <rect x="14" y="14" width="7" height="7" rx="1"/>
  </svg>
  <div>
    <h1>ADETSIS Barkod Sorgula</h1>
    <p>Periyot Muayene — Asansör Denetim Geçmişi</p>
  </div>
</header>

<div class="container">

  <div class="tabs">
    <button class="tab active" onclick="switchTab('scanner')" id="tabScanner">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M4 7V4h3M20 7V4h-3M4 17v3h3M20 17v3h-3"/>
        <line x1="4" y1="12" x2="20" y2="12"/>
      </svg>
      Kamera
    </button>
    <button class="tab" onclick="switchTab('manual')" id="tabManual">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="4" width="18" height="16" rx="2"/>
        <path d="M7 8h4M7 12h10M7 16h6"/>
      </svg>
      Manuel Giriş
    </button>
  </div>

  <!-- Scanner -->
  <div class="scanner-section active" id="scannerSection">
    <div id="reader"></div>
    <div class="scanned-label" id="scannedLabel">
      <span>Okunan Etiket:</span>
      <strong id="scannedValue"></strong>
    </div>
  </div>

  <!-- Manual -->
  <div class="manual-section" id="manualSection">
    <div class="input-group">
      <label>Etiket Numarası</label>
      <div class="input-row">
        <input type="text" id="etiketInput" placeholder="ör: 474976180-1" inputmode="text" autocomplete="off">
        <button class="btn btn-primary" onclick="manualSearch()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="history-section" id="historySection" style="display:none">
      <h3>Son Aramalar</h3>
      <div class="history-chips" id="historyChips"></div>
    </div>
  </div>

  <!-- Loading -->
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p>ADETSIS sorgulanıyor...</p>
  </div>

  <!-- Error -->
  <div class="error-box" id="errorBox">
    <p id="errorText"></p>
  </div>

  <!-- Results -->
  <div class="results" id="results">
    <div class="results-header">
      <h2>Muayene Sonucu</h2>
      <div style="display:flex;gap:8px;align-items:center">
        <span class="results-count" id="resultsCount"></span>
        <button class="btn-clear" onclick="clearResults()">Temizle</button>
      </div>
    </div>

    <div class="asset-info" id="assetInfo"></div>
    <div id="cardList"></div>
  </div>

</div>

<script>
const FIRMA_CODE = 'PR0619';
const API_URL = 'https://adetsis.com/barcode/Service.asmx/Sorgula';

let scanner = null;
let searchHistory = JSON.parse(localStorage.getItem('barkod_history') || '[]');

// Tab switching
function switchTab(tab) {
  document.getElementById('tabScanner').classList.toggle('active', tab === 'scanner');
  document.getElementById('tabManual').classList.toggle('active', tab === 'manual');
  document.getElementById('scannerSection').classList.toggle('active', tab === 'scanner');
  document.getElementById('manualSection').classList.toggle('active', tab === 'manual');

  if (tab === 'scanner') {
    startScanner();
  } else {
    stopScanner();
    renderHistory();
    document.getElementById('etiketInput').focus();
  }
}

// Scanner
function startScanner() {
  if (scanner) return;
  try {
    scanner = new Html5Qrcode('reader');
    scanner.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: { width: 280, height: 150 }, aspectRatio: 1.5 },
      onScanSuccess,
      () => {}
    ).catch(err => {
      document.getElementById('reader').innerHTML =
        '<div class="camera-prompt">' +
        '<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">' +
        '<path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/>' +
        '<circle cx="12" cy="13" r="4"/></svg>' +
        '<p>Kamera erişimi sağlanamadı.<br>Tarayıcı ayarlarından kamera iznini kontrol edin.</p>' +
        '<button class="btn btn-primary" onclick="switchTab(\'manual\')">Manuel Giriş Yap</button></div>';
    });
  } catch(e) {
    console.error(e);
  }
}

function stopScanner() {
  if (scanner) {
    scanner.stop().then(() => { scanner.clear(); scanner = null; }).catch(() => { scanner = null; });
  }
}

function onScanSuccess(decoded) {
  // Vibrate for feedback
  if (navigator.vibrate) navigator.vibrate(100);

  let etiket = decoded.trim();

  // If full URL scanned, extract Etiket param
  if (etiket.includes('Etiket=')) {
    const m = etiket.match(/Etiket=([^&]+)/);
    if (m) etiket = m[1];
  }

  document.getElementById('scannedLabel').classList.add('active');
  document.getElementById('scannedValue').textContent = etiket;

  stopScanner();
  doSearch(etiket);
}

// Manual search
function manualSearch() {
  const val = document.getElementById('etiketInput').value.trim();
  if (!val) return;
  doSearch(val);
}

// Enter key
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('etiketInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') manualSearch();
  });
  startScanner();
});

// Search
function doSearch(etiket) {
  // Save to history
  searchHistory = searchHistory.filter(h => h !== etiket);
  searchHistory.unshift(etiket);
  if (searchHistory.length > 10) searchHistory.pop();
  localStorage.setItem('barkod_history', JSON.stringify(searchHistory));

  // UI
  document.getElementById('loading').classList.add('active');
  document.getElementById('results').classList.remove('active');
  document.getElementById('errorBox').classList.remove('active');

  const url = API_URL + '?FirmaCode=' + encodeURIComponent(FIRMA_CODE) + '&Etiket=' + encodeURIComponent(etiket);

  fetch(url)
    .then(r => {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(data => {
      document.getElementById('loading').classList.remove('active');

      if (!data || data.length === 0) {
        showError('Bu etiket numarasına ait kayıt bulunamadı.');
        return;
      }

      renderResults(data, etiket);
    })
    .catch(err => {
      document.getElementById('loading').classList.remove('active');
      showError('Sorgu başarısız: ' + err.message);
    });
}

function showError(msg) {
  document.getElementById('errorBox').classList.add('active');
  document.getElementById('errorText').textContent = msg;
}

function clearResults() {
  document.getElementById('results').classList.remove('active');
  document.getElementById('scannedLabel').classList.remove('active');
  document.getElementById('etiketInput').value = '';
  startScanner();
}

// Render
function renderResults(data, etiket) {
  document.getElementById('results').classList.add('active');
  document.getElementById('resultsCount').textContent = '1 sonuç';

  // En son kontrolü tarihe göre bul (periyodik/takip fark etmez)
  let f = data[0];
  for (let i = 1; i < data.length; i++) {
    if (data[i].DENETIMTARIH > f.DENETIMTARIH) f = data[i];
  }

  const etiketRenk = (f.ETIKET || '').toLowerCase().replace('ı', 'i');
  let cc = '';
  if (etiketRenk.includes('kirmizi') || etiketRenk.includes('kırmızı')) cc = 'red';
  else if (etiketRenk.includes('yesil') || etiketRenk.includes('yeşil')) cc = 'green';
  else if (etiketRenk.includes('mavi')) cc = 'blue';
  else if (etiketRenk.includes('sari') || etiketRenk.includes('sarı')) cc = 'yellow';

  const bg = {red:'#fef2f2',green:'#f0fdf4',blue:'#eff6ff',yellow:'#fffbeb'};
  const bd = {red:'#f87171',green:'#4ade80',blue:'#60a5fa',yellow:'#fbbf24'};
  const bx = {red:'#dc2626',green:'#16a34a',blue:'#1565c0',yellow:'#d97706'};
  const dt = formatDate(f.DENETIMTARIH);

  document.getElementById('assetInfo').innerHTML = '';
  const list = document.getElementById('cardList');
  list.innerHTML =
    '<div style="background:'+(bg[cc]||'#f8fafc')+';border:3px solid '+(bd[cc]||'#dfe3e8')+';border-radius:16px;padding:28px;text-align:center">' +
      '<div style="font-size:13px;color:#5f6b7a;margin-bottom:4px">Muayene Tarihi</div>' +
      '<div style="font-size:32px;font-weight:800;color:#1a2332;margin-bottom:12px">' + dt + '</div>' +
      '<span style="display:inline-block;font-size:16px;font-weight:800;padding:10px 32px;border-radius:24px;color:#fff;background:'+(bx[cc]||'#5f6b7a')+';box-shadow:0 0 20px '+(bd[cc]||'transparent')+'">' + escHtml(f.ETIKET || '—') + '</span>' +
      '<div style="margin-top:20px;padding-top:16px;border-top:2px solid '+(bd[cc]||'#dfe3e8')+';font-size:14px;color:#5f6b7a;text-align:left;line-height:1.6">' +
        '<strong style="color:#1a2332">' + escHtml(f.YAPIADRES || '') + '</strong><br>' +
        'Bina No: ' + escHtml(f.BINANO || '') + ' — Sıra: ' + escHtml(f.ASANSORSIRANO || '') +
      '</div>' +
    '</div>';
}

function formatDate(d) {
  if (!d) return '—';
  const parts = d.split('-');
  if (parts.length === 3) return parts[2] + '.' + parts[1] + '.' + parts[0];
  return d;
}

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// History
function renderHistory() {
  const section = document.getElementById('historySection');
  const chips = document.getElementById('historyChips');
  if (searchHistory.length === 0) { section.style.display = 'none'; return; }

  section.style.display = 'block';
  chips.innerHTML = '';
  searchHistory.forEach(h => {
    const chip = document.createElement('span');
    chip.className = 'history-chip';
    chip.textContent = h;
    chip.onclick = () => {
      document.getElementById('etiketInput').value = h;
      doSearch(h);
    };
    chips.appendChild(chip);
  });
}
</script>
</body>
</html>
